name: tv-app-launcher-profile
components:
  - id: main
    capabilities:
      - id: switch
        version: 1
      - id: refresh
        version: 1
    categories:
      - name: Switch
preferences:
  - name: serverUrl
    title: "Server URL"
    description: "Base URL of the Python utility (e.g., http://192.168.18.250:5000)"
    required: true
    preferenceType: string
    definition:
      stringType: text
      minLength: 1
      maxLength: 255
      default: "http://192.168.18.250:5000"
  - name: targetDevice
    title: "Target device"
    description: "Which device to launch the app on"
    required: true
    preferenceType: enumeration
    definition:
      options:
        s95: "S95 TV"
        m7: "M7 Monitor"
      default: "s95"
  - name: actionToken
    title: "Action token"
    description: "Optional. Must match ACTION_TOKEN on the server. Leave blank while that is empty."
    required: false
    preferenceType: string
    definition:
      stringType: password
      minLength: 0
      maxLength: 255
      default: ""
  - name: appId
    title: "App ID"
    description: "Optional. The Tizen app to open. Blank uses the built-in default."
    required: false
    preferenceType: string
    definition:
      stringType: text
      minLength: 0
      maxLength: 100
      default: ""
  - name: macS95
    title: "S95 TV MAC"
    description: "Optional. Identifies the display when its address changes. Blank uses the built-in."
    required: false
    preferenceType: string
    definition:
      stringType: text
      minLength: 0
      maxLength: 17
      default: ""
  - name: macM7
    title: "M7 Monitor MAC"
    description: "Optional. Identifies the display when its address changes. Blank uses the built-in."
    required: false
    preferenceType: string
    definition:
      stringType: text
      minLength: 0
      maxLength: 17
      default: ""
