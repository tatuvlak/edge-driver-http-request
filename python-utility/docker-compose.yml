# Container Station 3.x: Applications -> Create -> paste this file.
# Older Container Station: Images -> Build, then create the container by hand
# (see ../DEPLOYMENT_QNAP_CONTAINER_STATION.md).
#
# Configuration comes from /share/Container/tv-app-launcher/.env, by absolute
# path so it is found wherever Container Station copies this file to.
#
# There is deliberately no `environment:` block. Container Station copies the
# compose file to a temporary directory, so ${VAR} interpolation — which reads
# the .env sitting next to the compose file — would resolve to empty strings.
# Since `environment:` takes precedence over `env_file:`, those empty values
# would then override the real ones and the service would start with nothing
# configured, while the .env file still looked correct. Defaults live in
# app.py's Config class, so nothing is lost by leaving them out here.

services:
  tv-app-launcher:
    build:
      context: /share/Container/tv-app-launcher
      dockerfile: Dockerfile
    container_name: tv-app-launcher
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      # The weather database and the cache of discovered display addresses live
      # here. Without this volume both are discarded whenever the container is
      # recreated.
      - /share/Container/tv-app-launcher/data:/app/data
    env_file:
      - /share/Container/tv-app-launcher/.env
    networks:
      - tv-launcher-network
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5000/health', timeout=5).raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  tv-launcher-network:
    driver: bridge
