services:
  tv-app-launcher:
    build:
      context: /share/Container/tv-app-launcher
      dockerfile: Dockerfile
    container_name: tv-app-launcher
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      # Persist the weather database (and legacy OAuth tokens) across restarts
      - /share/Container/tv-app-launcher/data:/app/data
    environment:
      # OAuth configuration (preferred method)
      - ST_CLIENT_ID=${ST_CLIENT_ID}
      - ST_CLIENT_SECRET=${ST_CLIENT_SECRET}
      - ST_REFRESH_TOKEN=${ST_REFRESH_TOKEN}
      # External callback URL (GitHub Pages) - service runs on local NAS
      - OAUTH_REDIRECT_URI=${OAUTH_REDIRECT_URI:-https://tatuvlak.github.io/tv-weather-oauth/callback.html}
      - TOKEN_FILE=${TOKEN_FILE:-/app/data/oauth_tokens.json}
      # PAT fallback (deprecated)
      - SMARTTHINGS_PAT=${SMARTTHINGS_PAT}
      # Display configuration - LAN addresses, not SmartThings device IDs
      - TV_HOST_S95=${TV_HOST_S95}
      - TV_HOST_M7=${TV_HOST_M7}
      - TV_APP_ID=${TV_APP_ID}
      - TV_READY_TIMEOUT=${TV_READY_TIMEOUT:-30}
      - TV_LAUNCH_ATTEMPTS=${TV_LAUNCH_ATTEMPTS:-3}
      # Weather data hub
      - WEATHER_DB_PATH=${WEATHER_DB_PATH:-/app/data/weather.db}
      - WEATHER_STALE_AFTER=${WEATHER_STALE_AFTER:-120}
      - WEATHER_RETENTION_DAYS=${WEATHER_RETENTION_DAYS:-30}
      - INGEST_TOKEN=${INGEST_TOKEN}
      - READ_TOKEN=${READ_TOKEN}
      - ACTION_TOKEN=${ACTION_TOKEN}
      # Server configuration
      - HOST=${HOST:-0.0.0.0}
      - PORT=${PORT:-5000}
      - SECRET_KEY=${SECRET_KEY}
    env_file:
      - /share/Container/tv-app-launcher/.env
    networks:
      - tv-launcher-network
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5000/health', timeout=5).raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  tv-launcher-network:
    driver: bridge
